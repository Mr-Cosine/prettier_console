[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prettier_console" 
version = "1.5.0"
description = "Provide you a toolkit to construct arrow-key menus, ASCII-art banners and colored output text for your Python terminal apps."
authors = [{name = "MrCosine", email = "a95sun@uwaterloo.ca"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "keyboard>=0.13.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/mr-cosine/prettier_console"

[project.scripts]
prettier_console = "prettier_console.manage:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prettier_console*"]

[tool.setuptools.package-data]
"prettier_console.ascii_art" = ["font/*.json"]